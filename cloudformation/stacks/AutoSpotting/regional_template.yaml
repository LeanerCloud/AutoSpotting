AWSTemplateFormatVersion: "2010-09-09"
Description: Forward regional events to the default EventBridge topic from the main AutoSpotting region.
Parameters:
  MainRegion:
    Type: String
    Description: The AWS region where AutoSpotting is installed.
  EventsRoleArn:
    Type: String
    Description: The ARN of the IAM role that should be assumed when putting events to the default event bus.

Conditions:
  IsNotMainRegion: !Not [!Equals [!Ref "AWS::Region", !Ref MainRegion]]

Resources:
  SpotTerminationEventRule:
    Condition: IsNotMainRegion
    Type: "AWS::Events::Rule"
    Properties:
      Description: >
        "This rule is triggered 2 minutes before AWS terminates a spot
        instance or when AWS sends a Rebalance Recommendation"
      EventPattern:
        detail-type:
          - "EC2 Spot Instance Interruption Warning"
          - "EC2 Instance Rebalance Recommendation"
        source:
          - "aws.ec2"
      State: "ENABLED"
      Targets:
        - Arn: !Sub "arn:${AWS::Partition}:events:${MainRegion}:${AWS::AccountId}:event-bus/default"
          Id: "Target0"
          RoleArn: !Ref EventsRoleArn

  InstanceRunningEventRule:
    Condition: IsNotMainRegion
    Type: "AWS::Events::Rule"
    Properties:
      Description: >
        "This rule is triggered after EC2 launches a new instance"
      EventPattern:
        detail-type:
          - "EC2 Instance State-change Notification"
        source:
          - "aws.ec2"
        detail:
          state:
            - "running"
      State: "ENABLED"
      Targets:
        - Arn: !Sub "arn:${AWS::Partition}:events:${MainRegion}:${AWS::AccountId}:event-bus/default"
          Id: "Target0"
          RoleArn: !Ref EventsRoleArn

  LifecycleHookEventRule:
    Condition: IsNotMainRegion
    Type: "AWS::Events::Rule"
    Properties:
      Description: >
        "This rule is triggered after we failed to complete a lifecycle hook"
      EventPattern:
        detail-type:
          - "AWS API Call via CloudTrail"
        source:
          - "aws.autoscaling"
        detail:
          eventName:
            - "CompleteLifecycleAction"
          errorCode:
            - "ValidationException"
          requestParameters:
            lifecycleActionResult:
              - "CONTINUE"
      State: "ENABLED"
      Targets:
        - Arn: !Sub "arn:${AWS::Partition}:events:${MainRegion}:${AWS::AccountId}:event-bus/default"
          Id: "Target0"
          RoleArn: !Ref EventsRoleArn
